name = "local-ai-chat-gateway"
main = "worker.mjs"
compatibility_date = "2026-08-31"

# Create this namespace first, then paste its ID here. It stores only opaque
# invite records, never provider credentials.
[[kv_namespaces]]
binding = "INVITES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[vars]
# The endpoint and model are intentionally server-controlled: browser users
# cannot select an expensive arbitrary model.
RUNPOD_ENDPOINT_ID = "REPLACE_WITH_RUNPOD_ENDPOINT_ID"
PUBLIC_MODEL = "your-web-model"
ALLOWED_ORIGIN = "https://your-domain.example"
REQUESTS_PER_MINUTE = "12"
