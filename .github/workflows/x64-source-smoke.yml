name: Preflight x64 launchers before release

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.platform }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: win32-x64
            runner: windows-2025
          - platform: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Preserve signed source bytes on Windows
        if: matrix.platform == 'win32-x64'
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Verify signed source and launch with the pinned native runtime
        run: node .github/scripts/source-smoke.mjs
